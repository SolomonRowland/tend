<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Ministry Table</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ministry Table">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
:root{
  --red:#B42318; --red-dark:#912018; --red-tint:#FEF3F2; --red-line:#FECDCA;
  --ink:#1D2939; --muted:#667085; --faint:#98A2B3; --line:#EAECF0; --bg:#FFFFFF; --soft:#F9FAFB;
  --green:#067647; --green-tint:#ECFDF3; --amber:#B54708; --amber-tint:#FFFAEB;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
a{color:var(--red)}
#app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:calc(32px + var(--safe-bot))}

/* top bar */
.bar{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(var(--safe-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;min-height:56px}
.bar .back{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--red);flex:0 0 auto}
.bar .back:hover{background:var(--red-tint)}
.bar .ttl{flex:1;min-width:0}
.bar .ttl b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .ttl small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
.brand .mark{width:28px;height:28px;border-radius:8px;background:var(--red);display:grid;place-items:center;color:#fff}
.demo-flag{font-size:11.5px;font-weight:700;color:var(--red);background:var(--red-tint);border:1px solid var(--red-line);padding:3px 8px;border-radius:999px;white-space:nowrap}

main{padding:16px}
h1{font-size:26px;line-height:1.2;margin:4px 0 6px}
h2{font-size:17px;margin:0}
.sec{margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.sec h2 small{font-weight:500;color:var(--muted);font-size:13px;margin-left:6px}
.muted{color:var(--muted)}
.small{font-size:13px}
.lead{color:var(--muted);margin:0 0 4px;line-height:1.45}

/* buttons */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:999px;font-weight:600;background:var(--red);color:#fff;white-space:nowrap}
.btn:hover{background:var(--red-dark)}
.btn.ghost{background:#fff;color:var(--red);border:1px solid var(--red-line)}
.btn.ghost:hover{background:var(--red-tint)}
.btn.plain{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.block{width:100%}
.btn.sm{min-height:34px;padding:0 12px;font-size:13.5px}
.btn[disabled]{opacity:.5;pointer-events:none}
.link{color:var(--red);font-weight:600;font-size:14px;min-height:34px;padding:0 12px;border-radius:999px;background:var(--red-tint);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.danger{color:var(--red)}

/* cards and rows */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.card + .card{margin-top:10px}
.list{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);width:100%;text-align:left;background:#fff}
.row:first-child{border-top:0}
button.row:hover{background:var(--soft)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.row .r{flex:0 0 auto;text-align:right;font-size:13.5px;font-weight:600}
.empty{padding:18px 16px;color:var(--muted);font-size:14px;text-align:center}
.chev{color:var(--faint);flex:0 0 auto}

.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.red{background:var(--red-tint);color:var(--red);border-color:var(--red-line)}
.pill.green{background:var(--green-tint);color:var(--green);border-color:#ABEFC6}
.pill.amber{background:var(--amber-tint);color:var(--amber);border-color:#FEDF89}

/* dashboard tiles */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:112px;transition:border-color .15s,box-shadow .15s}
.tile:hover{border-color:var(--red-line);box-shadow:0 2px 10px rgba(180,35,24,.07)}
.tile .ic{width:32px;height:32px;border-radius:9px;background:var(--red-tint);color:var(--red);display:grid;place-items:center}
.tile .nm{font-weight:700;font-size:14.5px}
.tile .st{font-size:13px;color:var(--muted);margin-top:auto}
.tile .st b{color:var(--ink)}
.meter{height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--red);border-radius:99px}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.stat .k{font-size:12.5px;color:var(--muted)}
.stat .v{font-size:20px;font-weight:700;margin-top:2px}
.stat.hl{background:var(--red-tint);border-color:var(--red-line)}
.stat.hl .v{color:var(--red)}

/* chips */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.chip{min-height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--muted);background:#fff}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}

/* check */
.ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:0 0 auto;color:#fff;background:#fff}
.ck.on{background:var(--red);border-color:var(--red)}
.ck.sq{border-radius:8px}

/* event hero on public page */
.hero{border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:6px}
.hero .band{height:8px;background:var(--red)}
.hero .in{padding:18px}
.hero .eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--red)}
.hero .meta{display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:14px;margin-top:4px}
.slot{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;gap:12px;align-items:center;background:#fff}
.slot + .slot{margin-top:8px}
.slot .main{flex:1;min-width:0}
.slot .t{font-weight:600}
.slot .s{font-size:13px;color:var(--muted);margin-top:3px}
.slot.full{background:var(--soft)}
.daylbl{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 8px}

/* forms and sheet */
.scrim{position:fixed;inset:0;background:rgba(16,24,40,.42);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@media(min-width:640px){.scrim{align-items:center}}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + var(--safe-bot));animation:up .2s}
@media(min-width:640px){.sheet{border-radius:20px}}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.sheet h3{margin:0 0 4px;font-size:19px}
.sheet .acts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.sheet .acts .btn{flex:1}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.fld{display:flex;flex-direction:column;gap:5px;grid-column:span 2}
.fld.half{grid-column:span 1}
.fld label{font-size:13px;font-weight:600;color:var(--ink)}
.fld .hint{font-size:12px;color:var(--muted)}
.inp{width:100%;min-height:44px;padding:10px 12px;border:1px solid #D0D5DD;border-radius:10px;background:#fff;font-size:16px}
textarea.inp{min-height:84px;resize:vertical}
.inp:focus{outline:0;border-color:var(--red);box-shadow:0 0 0 3px rgba(180,35,24,.12)}
.cbx{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14.5px;cursor:pointer}
.cbx input{accent-color:var(--red);width:18px;height:18px;margin:1px 0 0}
.cbx + .cbx{margin-top:6px}
.err{background:var(--red-tint);color:var(--red-dark);border:1px solid var(--red-line);padding:10px 12px;border-radius:10px;font-size:14px;margin-top:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px}
.seg button{flex:1;min-height:34px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--red);color:#fff}

.toast{position:fixed;left:50%;bottom:calc(20px + var(--safe-bot));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.18);animation:fade .2s;max-width:90vw}
.qr{display:flex;gap:14px;align-items:center}
.qr .code{width:128px;height:128px;flex:0 0 auto;border:1px solid var(--line);border-radius:10px;padding:6px;background:#fff}
.qr .code svg{width:100%;height:100%;display:block}
.urlbox{font-size:12.5px;color:var(--muted);word-break:break-all;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin:6px 0}
.auth{max-width:420px;margin:0 auto;padding:40px 18px}
.auth .logo{width:56px;height:56px;border-radius:16px;background:var(--red);display:grid;place-items:center;color:#fff;margin-bottom:14px}
.tag{display:inline-block;font-size:12px;color:var(--muted);background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin:2px 4px 0 0}
.spacer{height:12px}
.printonly{display:none}
@media print{
  body *{visibility:hidden}
  .printonly,.printonly *{visibility:visible}
  .printonly{display:block;position:absolute;inset:0;padding:40px;text-align:center}
  .printonly .qrbig{width:320px;height:320px;margin:20px auto}
  .printonly .qrbig svg{width:100%;height:100%}
}
</style>
</head>

/* ---------- demo data ---------- */

  var org = 'org-demo', ev = 'ev-demo', me = 'user-demo';

      var s = { id: uuid(), event_id: it.event_id, item_id: itemId, name: name.trim(), phone: phone || '', email: email || '', note: note || '', token: uid('t'), checked_in_at: null, created_at: new Date().toISOString() };
      D.signups.push(s); save(); return ok(s.token);
    },
    unsign: function (tok) { D.signups = D.signups.filter(function (s) { return s.token !== tok; }); save(); return ok(); },
    mine: function (toks) { return ok(D.signups.filter(function (s) { return toks.indexOf(s.token) >= 0; }).map(function (s) { return { token: s.token, item_id: s.item_id, name: s.name }; })); },
    connect: function (slug, name, phone, email, responses, prayer) {
      var ev = D.events.find(function (e) { return e.slug === slug; }); if (!ev) return fail('This event was not found.');
      if (!String(name || '').trim()) return fail('Please add your name.');
      D.contacts.push({ id: uuid(), event_id: ev.id, name: name.trim(), phone: phone || '', email: email || '', responses: responses || [], prayer: prayer || '', status: 'new', follow_up_by: '', notes: '', created_at: new Date().toISOString() });
      save(); return ok();
    }
  };
}

/* ---------- data layer: cloud (Supabase) ---------- */
function CloudDB() {
  var sb = window.supabase.createClient(CLOUD_URL, CLOUD_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storageKey: 'ed.auth' } });
  function q(p) { return p.then(function (r) { if (r.error) throw r.error; return r.data; }); }
  var me = null;
  return {
    mode: 'cloud', sb: sb,
    user: function () { return sb.auth.getSession().then(function (r) { me = r.data.session ? r.data.session.user : null; return me; }); },
    signIn: function (e, p) { return sb.auth.signInWithPassword({ email: e, password: p }).then(function (r) { if (r.error) throw r.error; me = r.data.user; return me; }); },
    signUp: function (e, p) { return sb.auth.signUp({ email: e, password: p, options: { emailRedirectTo: location.origin + location.pathname } }).then(function (r) { if (r.error) throw r.error; me = r.data.session ? r.data.user : null; return me; }); },
    signOut: function () { return sb.auth.signOut(); },
    resetPassword: function (e) { return q(sb.auth.resetPasswordForEmail(e, { redirectTo: location.origin + location.pathname })); },
    myOrg: function () {
      return q(sb.from('ed_members').select('org_id, role').eq('user_id', me.id).limit(1)).then(function (rows) {
        if (!rows.length) return null;
        var oid = rows[0].org_id, role = rows[0].role;
        return Promise.all([
          q(sb.from('ed_orgs').select('id, name').eq('id', oid).single()),
          q(sb.from('ed_members').select('org_id, user_id, email, name, role').eq('org_id', oid).order('joined_at')),
          role === 'owner' ? q(sb.from('ed_invites').select('code, org_id, created_at, expires_at').eq('org_id', oid)) : Promise.resolve([])
        ]).then(function (r) { return { org: r[0], role: role, members: r[1], invites: r[2] }; });
      });
    },
    createOrg: function (name, display) { return q(sb.rpc('ed_create_org', { p_name: name, p_display: display })); },
    renameOrg: function (id, name) { return q(sb.from('ed_orgs').update({ name: name }).eq('id', id)); },
    createInvite: function (oid) { return q(sb.rpc('ed_create_invite', { oid: oid })); },
    cancelInvite: function (c) { return q(sb.from('ed_invites').delete().eq('code', c)); },
    acceptInvite: function (code, display) { return q(sb.rpc('ed_accept_invite', { p_code: code, p_display: display })); },
    removeMember: function (oid, u) { return q(sb.rpc('ed_remove_member', { oid: oid, uid: u })); },
    setMyName: function (oid, n) { return q(sb.from('ed_members').update({ name: n }).eq('org_id', oid).eq('user_id', me.id)); },
    listEvents: function (oid) { return q(sb.from('ed_events').select('*').eq('org_id', oid).order('starts_on', { ascending: true, nullsFirst: false })); },
    saveEvent: function (ev) {
      var row = Object.assign({}, ev); delete row.created_at;
      if (row.id) { var id = row.id; delete row.id; delete row.org_id; return q(sb.from('ed_events').update(row).eq('id', id).select().single()); }
      return q(sb.from('ed_events').insert(row).select().single());
    },
    deleteEvent: function (id) { return q(sb.from('ed_events').delete().eq('id', id)); },
    loadOrgRecords: function (oid) { return q(sb.from('ed_records').select('org_id, id, event_id, kind, data').eq('org_id', oid)); },
    loadEvent: function (id, oid) {
      return Promise.all([
        q(sb.from('ed_items').select('*').eq('event_id', id).order('sort').order('created_at')),
        q(sb.from('ed_signups').select('*').eq('event_id', id).order('created_at')),
        q(sb.from('ed_contacts').select('*').eq('event_id', id).order('created_at', { ascending: false })),
        q(sb.from('ed_records').select('org_id, id, event_id, kind, data').eq('org_id', oid).or('event_id.eq.' + id + ',event_id.is.null'))
      ]).then(function (r) { return { items: r[0], signups: r[1], contacts: r[2], records: r[3] }; });
    },
    saveItem: function (it) { var row = Object.assign({}, it); delete row.created_at; return q(sb.from('ed_items').upsert(row.id ? row : Object.assign({ id: uuid() }, row)).select().single()); },
    deleteItem: function (id) { return q(sb.from('ed_items').delete().eq('id', id)); },
    saveSignup: function (s) { var row = Object.assign({}, s); delete row.created_at; delete row.token; return q(sb.from('ed_signups').upsert(row.id ? row : Object.assign({ id: uuid() }, row)).select().single()); },
    deleteSignup: function (id) { return q(sb.from('ed_signups').delete().eq('id', id)); },
    saveContact: function (c) { var row = Object.assign({}, c); delete row.created_at; return q(sb.from('ed_contacts').upsert(row.id ? row : Object.assign({ id: uuid() }, row)).select().single()); },
    deleteContact: function (id) { return q(sb.from('ed_contacts').delete().eq('id', id)); },
    saveRecord: function (r) { return q(sb.from('ed_records').upsert({ org_id: r.org_id, id: r.id, event_id: r.event_id, kind: r.kind, data: r.data }).select('org_id, id, event_id, kind, data').single()); },
    deleteRecord: function (oid, id) { return q(sb.from('ed_records').delete().eq('org_id', oid).eq('id', id)); },
    pub: function (slug) { return q(sb.rpc('ed_public', { p_slug: slug })); },
    sign: function (slug, item, name, phone, email, note) { return q(sb.rpc('ed_sign', { p_slug: slug, p_item: item, p_name: name, p_phone: phone, p_email: email, p_note: note })); },
    unsign: function (tok) { return q(sb.rpc('ed_unsign', { p_token: tok })); },
    mine: function (toks) { return q(sb.rpc('ed_mine', { p_tokens: toks })); },
    connect: function (slug, name, phone, email, responses, prayer) { return q(sb.rpc('ed_connect', { p_slug: slug, p_name: name, p_phone: phone, p_email: email, p_responses: responses, p_prayer: prayer })); }
  };
}

/* ---------- routing ---------- */
function openPub(kind, slug) {
  if (window.ED_DEMO) { S.pubMode = kind; S.pubSlug = slug; S.cardDone = false; S.pub = null; render(); loadPublic(); }
  else location.hash = '#/' + kind + '/' + slug;
}
function route() {
  var m = /^#\/(e|c)\/([a-z0-9-]+)/.exec(location.hash || '');
  if (m) { S.pubMode = m[1]; S.pubSlug = m[2]; return loadPublic(); }
  S.pubMode = ''; S.pub = null;
  if (!S.user && !S.loading) render();
}
window.addEventListener('hashchange', route);

function go(view, mod) { S.stack.push({ view: S.view, mod: S.mod }); S.view = view; S.mod = mod || null; render(); window.scrollTo(0, 0); }
function back() { var p = S.stack.pop() || { view: 'home' }; S.view = p.view; S.mod = p.mod; render(); window.scrollTo(0, 0); }

/* ---------- start-up ---------- */
function boot() {
  if (/^#\/(e|c)\//.test(location.hash || '')) { route(); return; }
  DB.user().then(function (u) {
    S.user = u; if (!u) { S.loading = false; render(); return; }
    return loadAcct();
  }).catch(function (e) { S.loading = false; S.authMsg = errMsg(e); render(); });
}
function loadAcct() {
  return DB.myOrg().then(function (a) {
    S.acct = a; if (!a) { S.loading = false; render(); return; }
    return Promise.all([DB.listEvents(a.org.id), DB.loadOrgRecords(a.org.id)]).then(function (r) { S.events = r[0]; S.orgRecs = r[1]; S.loading = false; render(); });
  }).catch(function (e) { S.loading = false; S.authMsg = errMsg(e); render(); });
}
function openEvent(id) {
  S.ev = S.events.find(function (e) { return e.id === id; });

  return DB.loadEvent(id, org().id).then(function (d) { S.data = d; render(); }).catch(function (e) { toast(errMsg(e)); });
}
function reloadEvent() { if (!S.ev) return Promise.resolve(); return DB.loadEvent(S.ev.id, org().id).then(function (d) { S.data = d; render(); }); }

/* ---------- render ---------- */
function bar(title, sub, opts) {

}
function render() {

  else if (S.loading) h = '<div class="auth"><div class="logo">' + IC.tent + '</div><p class="muted">Loading…</p></div>';

  else if (S.view === 'event' && S.ev) h = viewEvent();

function renderLayer() {
  var h = '';
  if (S.sheet) h += '<div class="scrim" data-a="scrim"><div class="sheet" role="dialog" aria-modal="true">' + S.sheet.html() + (S.sheet.err ? '<div class="err">' + esc(S.sheet.err) + '</div>' : '') + '</div></div>';
  if (S.toast) h += '<div class="toast">' + esc(S.toast) + '</div>';
  var layer = $('#layer');
  var keep = S.sheet && layer.querySelector('.sheet');
  if (keep && S.sheet.rendered) {
    // keep typed values when only the error or busy state changes
    var errEl = keep.querySelector('.err'); if (errEl) errEl.remove();
    if (S.sheet.err) keep.insertAdjacentHTML('beforeend', '<div class="err">' + esc(S.sheet.err) + '</div>');
    keep.querySelectorAll('[data-save]').forEach(function (b) { b.disabled = S.busy; });
    var t = layer.querySelector('.toast'); if (t) t.remove(); if (S.toast) layer.insertAdjacentHTML('beforeend', '<div class="toast">' + esc(S.toast) + '</div>');
    return;

}

function readForm(fields) {

function editGear(r) { editRecord('gear', r, { orgWide: true, sub: 'Shared by every event in ' + org().name + '.' }); }

document.addEventListener('submit', function (ev) {
  var f = ev.target, k = f.getAttribute('data-form'); if (!k) return; ev.preventDefault();
  var v = {}; new FormData(f).forEach(function (val, key) { if (key === 'r') (v.r = v.r || []).push(val); else v[key] = String(val).trim(); });
  if (k === 'auth') {
    S.authMsg = ''; S.busy = true; render();
    var p = S.authMode === 'reset' ? DB.resetPassword(v.email).then(function () { S.authMsg = 'Check your email for a reset link.'; S.authMode = 'in'; })
      : (S.authMode === 'up' ? DB.signUp(v.email, v.pw) : DB.signIn(v.email, v.pw)).then(function (u) {
        if (!u) { S.authMsg = 'Check your email to confirm your account, then sign in.'; S.authMode = 'in'; return; }
        S.user = u; S.loading = true; return loadAcct();
      });
    p.catch(function (e) { S.authMsg = errMsg(e); }).then(function () { S.busy = false; render(); });
  } else if (k === 'create-org') {
    DB.createOrg(v.name, v.me).then(loadAcct).catch(function (e) { S.authMsg = errMsg(e); render(); });
  } else if (k === 'join') {
    if (!v.code) { S.authMsg = 'Paste the code from your invite link.'; render(); return; }
    DB.acceptInvite(v.code.replace(/^.*join=/, ''), v.me).then(function () { lset('ed.join', null); return loadAcct(); }).catch(function (e) { S.authMsg = errMsg(e); render(); });
  } else if (k === 'card') {
    S.pubErr2 = ''; S.busy = true;
    if (!v.phone && !v.email) { S.busy = false; S.pubErr2 = 'Add a phone number or email so we can reach you.'; render(); return; }

  }
});
