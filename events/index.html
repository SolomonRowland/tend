<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tent &amp; Table</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tent &amp; Table">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --red:#B42318; --red-dark:#912018; --red-tint:#FEF3F2; --red-line:#FECDCA;
  --ink:#1D2939; --muted:#667085; --faint:#98A2B3; --line:#EAECF0; --bg:#FFFFFF; --soft:#F9FAFB;
  --green:#067647; --green-tint:#ECFDF3; --amber:#B54708; --amber-tint:#FFFAEB;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
a{color:var(--red)}
#app{max-width:820px;margin:0 auto;min-height:100vh;padding-bottom:calc(32px + var(--safe-bot))}
body.has-nav #app{padding-bottom:calc(84px + var(--safe-bot))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.grow{flex:1}
.center{text-align:center}

/* top bar */
.bar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(var(--safe-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;min-height:58px}
.bar .back,.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--red);flex:0 0 auto}
.bar .back:hover,.iconbtn:hover{background:var(--red-tint)}
.bar .ttl{flex:1;min-width:0}
.bar .ttl b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .ttl small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandmark{width:32px;height:32px;border-radius:9px;background:var(--red);display:grid;place-items:center;color:#fff;flex:0 0 auto}
.demo-flag{font-size:11.5px;font-weight:700;color:var(--red);background:var(--red-tint);border:1px solid var(--red-line);padding:3px 8px;border-radius:999px;white-space:nowrap}

/* tabs: underline style, scroll sideways when there are many */
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin:0 -16px 4px;padding:0 12px;background:#fff}
.tabs::-webkit-scrollbar{display:none}
.tabs.sticky{position:sticky;top:calc(58px + var(--safe-top));z-index:15;margin:0;padding:0 8px}
.tabs button{flex:0 0 auto;padding:13px 12px 11px;font-weight:600;font-size:14.5px;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--red);border-bottom-color:var(--red)}
@media(max-width:430px){.tabs button{padding:13px 9px 11px;font-size:14px}.tabs:not(.sticky) .count{display:none}}
.count{font-size:12px;font-weight:700;color:var(--faint);margin-left:2px}
.tabs button[aria-selected="true"] .count{color:var(--red)}
.subtabs{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;overflow-x:auto;scrollbar-width:none;margin:2px 0 14px}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:1 0 auto;min-height:36px;padding:0 12px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap;text-align:center}
.subtabs button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.1)}

/* toolbar: search + dropdown filters */
.toolbar{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
.search{flex:1 1 200px;display:flex;align-items:center;gap:8px;border:1px solid #D0D5DD;border-radius:10px;padding:0 12px;min-height:42px;color:var(--faint);background:#fff}
.search.block{margin:12px 0 4px}
.search input{border:0;outline:0;flex:1;min-width:0;font-size:16px;background:transparent}
.search:focus-within{border-color:var(--red);box-shadow:0 0 0 3px rgba(180,35,24,.12)}
.inp.sm{width:auto;min-height:42px;padding:8px 10px;font-size:14.5px;flex:0 1 auto}

/* bottom nav */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + var(--safe-bot))}
.bottomnav button{flex:0 1 160px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:12px;font-weight:600;color:var(--faint);border-radius:10px}
.bottomnav button[aria-current]{color:var(--red)}

main{padding:16px}
h1{font-size:26px;line-height:1.2;margin:4px 0 6px;text-wrap:balance}
h2{font-size:17px;margin:0}
h4{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 0 8px}
.sec{margin:24px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.sec h2 small{font-weight:500;color:var(--muted);font-size:13px;margin-left:6px}
.grouplbl{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.lead{color:var(--muted);margin:0 0 6px;line-height:1.45}
.demo-note{margin-top:28px;text-align:center}

/* buttons */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:999px;font-weight:600;background:var(--red);color:#fff;white-space:nowrap}
.btn:hover{background:var(--red-dark)}
.btn.ghost{background:#fff;color:var(--red);border:1px solid var(--red-line)}
.btn.ghost:hover{background:var(--red-tint)}
.btn.plain{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.block{width:100%}
.btn.sm{min-height:34px;padding:0 12px;font-size:13.5px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.link{color:var(--red);font-weight:600;font-size:14px;min-height:34px;padding:0 10px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;text-decoration:none}
.link:hover{background:var(--red-tint)}
.linklike{font-weight:600;text-align:left}
.linklike:hover{color:var(--red)}
.danger{color:var(--red)}
.danger svg{vertical-align:-3px}
b.red{color:var(--red)}

/* cards and rows */
.card{display:block;width:100%;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;text-align:left}
.card + .card{margin-top:10px}
.card.tip{margin-top:16px;background:var(--soft)}
.card.notes{white-space:pre-wrap;line-height:1.5}
.card.good{color:var(--green);display:flex;align-items:center;justify-content:center;gap:8px}
.list{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.list.inner{border-radius:10px;margin-top:10px}
.list.menu{margin-top:12px}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);width:100%;text-align:left;background:#fff}
.row:first-child{border-top:0}
button.row:hover,.row button.main:hover{background:var(--soft)}
.row .main{flex:1;min-width:0}
.row button.main{border-radius:8px;padding:2px 4px;margin:-2px -4px}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .t.done{text-decoration:line-through;color:var(--faint)}
.row .s{font-size:13px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere;line-height:1.45}
.amt{font-weight:700;text-align:right;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end}
.amt .pill{margin-top:4px}
.amt small{font-weight:600;font-size:12px;color:var(--red)}
.qty{font-weight:700;font-size:16px;min-width:32px;text-align:right}
.empty{padding:18px 16px;color:var(--muted);font-size:14px;text-align:center;line-height:1.45}
.chev{color:var(--faint);flex:0 0 auto}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--red-tint);color:var(--red);display:grid;place-items:center;font-size:13px;font-weight:700;flex:0 0 auto}
.datebox{width:46px;flex:0 0 auto;border:1px solid var(--red-line);border-radius:10px;text-align:center;overflow:hidden;background:#fff}
.datebox small{display:block;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;text-transform:uppercase;padding:2px 0}
.datebox b{display:block;font-size:18px;padding:3px 0}
.datebox.sm{width:40px}.datebox.sm b{font-size:15px;padding:2px 0}
.time{width:62px;flex:0 0 auto;font-weight:700;font-size:13.5px}
.time small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
.dot.red{background:var(--red-tint);color:var(--red)}
.dot.amber{background:var(--amber-tint);color:var(--amber)}
.tag{display:inline-block;font-size:12px;color:var(--muted);background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin:2px 4px 0 0}

.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--muted);border:1px solid var(--line);white-space:nowrap;vertical-align:1px}
.pill.red{background:var(--red-tint);color:var(--red);border-color:var(--red-line)}
.pill.green{background:var(--green-tint);color:var(--green);border-color:#ABEFC6}
.pill.amber{background:var(--amber-tint);color:var(--amber);border-color:#FEDF89}

.meter{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 2px}
.meter i{display:block;height:100%;background:var(--red);border-radius:99px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0 4px}
@media(min-width:560px){.stats{grid-template-columns:repeat(3,1fr)}}
.stat{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;min-width:0}
.stat .k{font-size:12.5px;color:var(--muted)}
.stat .v{font-size:20px;font-weight:700;margin-top:2px;overflow-wrap:anywhere}
.stat .v small{font-size:12.5px;font-weight:500;color:var(--muted)}
.stat.hl{background:var(--red-tint);border-color:var(--red-line)}
.stat.hl .v{color:var(--red)}

/* contact actions + info */
.acts-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.act{flex:1 1 0;min-width:52px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border:1px solid var(--red-line);border-radius:12px;color:var(--red);font-size:12.5px;font-weight:700;text-decoration:none;background:#fff}
.act:hover{background:var(--red-tint)}
.info{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:14px 0 0;font-size:14.5px}
.info dt{color:var(--muted);font-size:13px;padding-top:1px}
.info dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap;user-select:text}
.sheethead{display:flex;align-items:center;gap:12px}
.sheethead > div{flex:1;min-width:0}
.sheethead .avatar{width:44px;height:44px;font-size:15px}

/* check */
.ck{width:28px;height:28px;border-radius:50%;border:2px solid #D0D5DD;display:grid;place-items:center;flex:0 0 auto;color:#fff;background:#fff}
.ck.on{background:var(--red);border-color:var(--red)}

/* hero */
.hero{border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:6px;background:#fff}
.hero .band{height:8px;background:var(--red)}
.hero .in{padding:18px}
.hero .eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--red)}
.hero .meta{color:var(--muted);font-size:14px;margin-top:4px;line-height:1.5}
.hero .about{line-height:1.5;margin:12px 0 4px}
.hero .acts-row{max-width:120px}

/* calendar */
.daystrip{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
.daystrip::-webkit-scrollbar{display:none}
.daystrip button{flex:0 0 62px;border:1px solid var(--line);border-radius:12px;padding:8px 0;text-align:center;position:relative;background:#fff}
.daystrip button small{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase}
.daystrip button b{display:block;font-size:20px;margin:1px 0}
.daystrip button i{position:absolute;left:50%;bottom:4px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--red)}
.daystrip button[aria-selected="true"]{background:var(--red);border-color:var(--red);color:#fff}
.daystrip button[aria-selected="true"] small{color:#fde2df}
.daystrip button[aria-selected="true"] i{background:#fff}

/* sign-up spots */
.slotcard + .slotcard{margin-top:10px}
.slot-head{display:flex;align-items:center;gap:10px}
.slot-head .main{flex:1;min-width:0}
.slotcard > .link{margin-top:8px}
.slot{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;gap:12px;align-items:center;background:#fff}
.slot + .slot{margin-top:8px}
.slot .main{flex:1;min-width:0}
.slot .t{font-weight:600}
.slot .s{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.45}
.slot.full{background:var(--soft)}
.setlist .sl-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.setlist ol{margin:8px 0 0;padding-left:22px;line-height:1.6}

/* equipment */
.eqrow{align-items:flex-start}
.eqchecks{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.cbx.sm{padding:5px 9px 5px 7px;gap:5px;font-size:12.5px;border-radius:999px;align-items:center}
.cbx.sm input{width:16px;height:16px}
.cbx.sm + .cbx.sm{margin-top:0}
.stepper{display:flex;align-items:center;gap:2px;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end;max-width:100px}
.stepper button{width:32px;height:32px;border-radius:50%;border:1px solid var(--red-line);color:var(--red);font-size:18px;font-weight:700;display:grid;place-items:center;text-align:center}
.stepper b{min-width:26px;text-align:center;font-size:16px}
.stepper small{width:100%;text-align:right;color:var(--muted);font-size:12px}

/* forms and sheet */
.scrim{position:fixed;inset:0;background:rgba(16,24,40,.42);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@media(min-width:640px){.scrim{align-items:center}}
.sheet{background:#fff;width:100%;max-width:580px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(18px + var(--safe-bot));animation:up .2s}
@media(min-width:640px){.sheet{border-radius:20px}}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.sheet h3{margin:0 0 4px;font-size:19px}
.sheet .acts{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap;align-items:center}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.fld{display:flex;flex-direction:column;gap:5px;grid-column:span 2;min-width:0;border:0;padding:0;margin:0}
.fld.half{grid-column:span 1}
@media(max-width:380px){.fld.half{grid-column:span 2}}
.fld label,.fld legend{font-size:13px;font-weight:600;color:var(--ink);padding:0;margin-bottom:5px}
.fld .hint{font-size:12px;color:var(--muted)}
.inp{width:100%;min-height:44px;padding:10px 12px;border:1px solid #D0D5DD;border-radius:10px;background:#fff;font-size:16px}
textarea.inp{min-height:84px;resize:vertical}
.inp:focus{outline:0;border-color:var(--red);box-shadow:0 0 0 3px rgba(180,35,24,.12)}
.cbx{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14.5px;cursor:pointer;font-weight:500}
.cbx input{accent-color:var(--red);width:18px;height:18px;margin:1px 0 0;flex:0 0 auto}
.multi{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.multi.one{grid-template-columns:1fr}
@media(max-width:420px){.multi{grid-template-columns:1fr}}
.err{background:var(--red-tint);color:var(--red-dark);border:1px solid var(--red-line);padding:10px 12px;border-radius:10px;font-size:14px;margin-top:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;background:var(--soft)}
.seg.wrap{flex-wrap:wrap}
.seg button{flex:1 0 auto;min-height:34px;padding:0 10px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink);text-align:center}
.seg button:hover{background:#fff}
.picklist{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:12px;margin-top:12px}
.pickrow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer}
.pickrow:first-child{border-top:0}
.pickrow input{accent-color:var(--red);width:20px;height:20px;flex:0 0 auto}
.pickrow .main{flex:1;min-width:0;display:flex;flex-direction:column}
.pickrow .t{font-weight:600}
.pickrow .s{font-size:12.5px;color:var(--muted)}
.pickrow.has{opacity:.55;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-bot));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.18);animation:fade .2s;max-width:90vw}
.qr{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.qr .main{flex:1 1 220px;min-width:0}
.qr .code{width:128px;height:128px;flex:0 0 auto;border:1px solid var(--line);border-radius:10px;padding:6px;background:#fff}
.qr .code svg{width:100%;height:100%;display:block}
.urlbox{font-size:12.5px;color:var(--muted);word-break:break-all;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin:6px 0;user-select:all}
.auth{max-width:440px;margin:0 auto;padding:40px 18px}
.auth .logo{width:56px;height:56px;border-radius:16px;background:var(--red);display:grid;place-items:center;color:#fff;margin-bottom:14px}
.auth .logo svg{width:34px;height:31px}
.brandmark svg{width:22px;height:20px}
.mine{margin:12px 0;border-color:#ABEFC6;background:var(--green-tint)}
.mine-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.thanks{text-align:center;padding:28px 18px;margin-top:12px}
.okmark{width:52px;height:52px;border-radius:50%;background:var(--green-tint);color:var(--green);display:inline-grid;place-items:center}
.okmark svg{width:26px;height:26px}
.pub .sec{margin-top:26px}

/* ===== v3 look: warm ground, red header band, soft cards, serif display type ===== */
:root{--ground:#F7EEEC;--petal:#FCF7F6;--blush:#F6DEDB;--deep:#9F2117;--hdr1:#A8241A;--hdr2:#C2412F;--label:#9F2117;
  --display:"Fraunces",Georgia,"Times New Roman",serif;--sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;--line:#F1E3E1}
html,body{background:var(--ground);font-family:var(--sans);-webkit-font-smoothing:antialiased}
#app{background:var(--petal);max-width:760px}
@media(min-width:800px){body{padding-block:24px}#app{border-radius:28px;overflow:clip;min-height:calc(100vh - 48px);box-shadow:0 0 0 1px var(--line),0 30px 80px -40px rgba(120,30,20,.35)}}
main{padding:14px 16px 24px}

/* header band */
.top{position:relative;background:linear-gradient(155deg,var(--hdr1) 0%,var(--hdr2) 100%);color:#fff;padding:calc(18px + var(--safe-top)) 18px 20px;border-radius:0 0 26px 26px;overflow:hidden}
.top::after{content:"";position:absolute;right:-50px;top:-64px;width:200px;height:200px;border-radius:50%;border:1.5px solid rgba(255,255,255,.16);pointer-events:none}
.top::before{content:"";position:absolute;right:30px;top:-20px;width:120px;height:120px;border-radius:50%;border:1.5px solid rgba(255,255,255,.10);pointer-events:none}

/* tabs: white pills on a red fill */
.tabs{background:linear-gradient(155deg,var(--hdr1) 0%,var(--hdr2) 100%);border:0;margin:0 -16px 6px;padding:8px 12px 10px;gap:4px}

.top{padding-bottom:16px}
.ws .top,.top:has(+ main > .tabs:first-child){border-radius:0}

.tabs button{color:#fff;opacity:.85;font-weight:600;font-size:14px;padding:0 14px;min-height:36px;border:0;border-radius:999px;background:rgba(255,255,255,.10)}

/* cards and lists: white on the warm ground, soft shadow, no hard borders */
.card,.list,.stat,.slot,.hero+.stats .stat{border:0;box-shadow:0 1px 2px rgba(120,30,20,.04),0 6px 18px -14px rgba(120,30,20,.3)}
